<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quiz developer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-blue: #1a215a;
            --brand-blue-dark: #151b4a;
            --brand-black: #000000;
            --brand-green: #d3ff3d;
            --text-light: #f5e9f2;
            /* --text-muted: #d9b9d1; */
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--brand-blue);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            background: var(--brand-green);
            opacity: 0.1;
        }
        body::before { width: 300px; height: 300px; top: -100px; left: -80px; }
        body::after { width: 380px; height: 380px; bottom: -140px; right: -100px; }

        .functions {
            background: var(--white);
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 380px;
            padding: 44px 36px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            position: relative;
            z-index: 1;
        }

        .functions::before {
            content: "Quiz developer panel";
            display: block;
            font-family: 'Baloo 2', sans-serif;
            font-weight: 800;
            font-size: 1.3rem;
            color: var(--brand-blue);
            text-align: center;
            margin-bottom: 6px;
        }

        .functions>a{
            margin-top:20px;
            text-decoration: none;
            color: var(--brand-blue-dark);
            font-size: 16px;
            font-weight: 700;
            padding: 14px 16px;
            border: none;
            border-radius: 10px;
            background-color: var(--brand-green);
            text-align: center;
            transition: transform 0.15s ease, background-color 0.2s ease, color 0.2s ease, box-shadow 0.15s ease;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.12);
        }
        .functions>a:hover {
            background-color: var(--brand-blue);
            color: var(--white);
            transform: translateY(-2px);
        }
        .functions>a:active {
            transform: translateY(1px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.12);
        }

        @media (max-width: 440px) {
            .functions { padding: 34px 24px; }
        }
    </style>
</head>
<body>

<div class="functions">
    <a th:href="@{/quizapp/allquestion}">show Question list</a>
    <!--    <a th:href="@{/quizapp/allquestion/category/{category}(category=${category})}">show Question list by category</a>-->
    <a th:href="@{/quizapp/category/java}">Show Java Questions</a>
    <a th:href="@{/quizapp/category/python}">Show Python Questions</a>
    <a th:href="@{/quizapp/add}">Add Question</a>
    <a th:href="@{/quizapp/delete}">Delete Question</a>
    <a th:href="@{/quizapp/deletequiz}">Delete Quiz</a>
</div>
</body>
</html>
