<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Question</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-blue: #1a215a;
            --brand-blue-dark: #151b4a;
            --brand-black: #000000;
            --brand-green: #d3ff3d;
            --text-light: #f5e9f2;
            /* --text-muted: #d9b9d1; */
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--brand-blue);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            background: var(--brand-green);
            opacity: 0.1;
        }
        body::before { width: 300px; height: 300px; top: -100px; left: -80px; }
        body::after { width: 380px; height: 380px; bottom: -140px; right: -100px; }

        h2 {
            font-family: 'Baloo 2', sans-serif;
            font-weight: 800;
            font-size: 1.9rem;
            color: var(--white);
            text-align: center;
            margin-bottom: 28px;
            position: relative;
            z-index: 1;
            display: block;
        }
        h2::after {
            content: "";
            display: block;
            width: 56px;
            height: 5px;
            background: var(--brand-green);
            border-radius: 3px;
            margin: 12px auto 0;
        }

        form {
            background: var(--white);
            width: 100%;
            max-width: 480px;
            padding: 40px 36px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            position: relative;
            z-index: 1;
        }

        label {
            display: block;
            font-weight: 700;
            font-size: 0.92rem;
            color: var(--brand-blue-dark);
            margin-bottom: 6px;
            letter-spacing: 0.2px;
        }

        input[type="text"] {
            width: 100%;
            font-family: 'Nunito', sans-serif;
            font-size: 1rem;
            padding: 12px 14px;
            border: 2px solid #e2e0ec;
            border-radius: 10px;
            background: #faf9fd;
            color: #2b1730;
            transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
            margin-bottom: 20px;
        }
        input[type="text"]:hover {
            border-color: #c9c6dd;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--brand-blue);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(26, 33, 90, 0.12);
        }
        input[type="text"]:required:invalid {
            border-color: #e2e0ec;
        }

        br { display: none; }

        button[type="submit"] {
            width: 100%;
            margin-top: 8px;
            background: var(--brand-blue);
            color: var(--white);
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 1.05rem;
            padding: 14px 0;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 5px 0 var(--brand-blue-dark);
            transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.15s ease;
        }
        button[type="submit"]:hover {
            background: var(--brand-blue-dark);
        }
        button[type="submit"]:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 var(--brand-blue-dark);
        }

        @media (max-width: 520px) {
            form { padding: 30px 24px; }
            h2 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

<h2>Add Question</h2>

<form th:action="@{/quizapp/add}" th:object="${question}" method="post">

    <label>Question:</label>
    <input type="text" th:field="*{question_title}" required><br><br>

    <label>Category:</label>
    <input type="text" th:field="*{category}" required><br><br>

    <label>Option1:</label>
    <input type="text" th:field="*{option1}" required><br><br>

    <label>Option2:</label>
    <input type="text" th:field="*{option2}" required><br><br>

    <label>Option3:</label>
    <input type="text" th:field="*{option3}" required><br><br>

    <label>Option4:</label>
    <input type="text" th:field="*{option4}" required ><br><br>

    <label>Right Answer:</label>
    <input type="text" th:field="*{right_answer}" required><br><br>

    <button type="submit">Save</button>

</form>

</body>
</html>
